# MR Motion Cam - button profile for Car Parking Multiplayer 2 (PC / Steam)
#
# Format:   action_name = kind target
#   kind  : tap   = press and release            (engine = tap z)
#           hold  = keep pressed while the phone button is held   (horn = hold g)
#           wheel = mouse wheel notches (+ up / - down)           (zoom_in = wheel 1)
#   target: a key (a-z, 0-9, space, tab, enter, esc, shift, ctrl, alt, caps, f1-f12, up, down, left, right)
#           or a mouse button (lmb, rmb, mmb)
#
# The keys below come from the community CPM 2 guide (cpm2guide.wiki). They are NOT verified by the game's
# developer, and the game is still in Early Access - if something does not react, change the key here
# (no need to rebuild the app) and restart the Hub.

engine     = tap z        # start / stop the engine
horn       = hold g       # horn
handbrake  = tap space    # handbrake
camera     = tap c        # cycle the camera
freecam    = hold c       # hold C and move the mouse = free interior camera
radial     = hold tab     # radial menu (headlights, hazards, lock, reset ...)
wheel_up   = wheel 1      # radial menu / zoom: wheel up
wheel_down = wheel -1     # radial menu / zoom: wheel down
doors      = hold f       # doors (when on foot)
drone      = hold mmb     # hold the mouse wheel button: phone / drone
click      = tap lmb      # left click (confirm in menus)
zoom_in    = wheel 1
zoom_out   = wheel -1
